name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_hardware_smoke:
        description: Run native V4L2 smoke on a self-hosted Linux webcam runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  package:
    name: Validate package (Linux glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run publish:check

  package-windows:
    name: Validate package (Windows)
    runs-on: windows-latest
    env:
      NODE_WEBCAM_SKIP_COMMANDCAM_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/validate-pack.js

  musl:
    name: Validate package fallback (Linux musl)
    runs-on: ubuntu-latest
    container: node:20-alpine
    steps:
      - name: Install checkout dependencies
        run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Assert glibc prebuild is not loaded on musl
        run: |
          node <<'NODE'
          const load = require('node-gyp-build')
          const report = process.report.getReport()

          if (report.header.glibcVersionRuntime)
            throw new Error('Expected musl runtime, but glibc was detected')

          try {
            load(process.cwd())
            throw new Error('Linux glibc prebuild loaded on musl')
          } catch (error) {
            if (/Linux glibc prebuild loaded on musl/.test(error.message))
              throw error
          }
          NODE
      - run: node scripts/validate-pack.js

  hardware-smoke:
    name: Native hardware smoke
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.run_hardware_smoke == true
    runs-on: [self-hosted, linux, webcam]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run native:smoke
